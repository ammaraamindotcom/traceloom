services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-intentshield}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-intentshield}
      POSTGRES_DB: ${POSTGRES_DB:-intentshield}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
